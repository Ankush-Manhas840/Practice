<rect class="rise" style="animation-delay:300ms" x="592.2" y="248.0" width="44.0" height="4.0" rx="6" fill="rgba(255,255,255,0.11)"/>
<text x="614.2" y="278" font-size="12" font-weight="500" fill="#A1A1A6" text-anchor="middle" letter-spacing="0.01em">Sep 7</text>
<rect class="rise" style="animation-delay:350ms" x="679.3" y="210.3" width="44.0" height="41.7" rx="6" fill="url(#accv)"/>
<text x="701.3" y="200.3" font-size="13" font-weight="650" fill="#F5F5F7" text-anchor="middle" letter-spacing="0.0em" class="num">16</text>
<text x="701.3" y="278" font-size="12" font-weight="500" fill="#A1A1A6" text-anchor="middle" letter-spacing="0.01em">Sep 14</text>
<rect class="rise" style="animation-delay:400ms" x="766.4" y="215.5" width="44.0" height="36.5" rx="6" fill="url(#accv)"/>
<text x="788.4" y="205.5" font-size="13" font-weight="650" fill="#F5F5F7" text-anchor="middle" letter-spacing="0.0em" class="num">14</text>
<text x="788.4" y="278" font-size="12" font-weight="500" fill="#A1A1A6" text-anchor="middle" letter-spacing="0.01em">Sep 21</text>
<text x="48" y="310" font-size="12" font-weight="500" fill="#A1A1A6" text-anchor="start" letter-spacing="0.01em">The first week includes 20 pattern-printing problems that were logged together.</text>
