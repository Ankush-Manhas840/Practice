<rect class="rise" style="animation-delay:200ms" x="418.0" y="248.0" width="44.0" height="4.0" rx="6" fill="url(#accv)"/>
<text x="440.0" y="238.0" font-size="13" font-weight="650" fill="#F5F5F7" text-anchor="middle" letter-spacing="0.0em" class="num">1</text>
