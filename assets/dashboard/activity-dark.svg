<rect class="rise" style="animation-delay:250ms" x="505.1" y="244.2" width="44.0" height="7.8" rx="6" fill="url(#accv)"/>
<text x="527.1" y="234.2" font-size="13" font-weight="650" fill="#F5F5F7" text-anchor="middle" letter-spacing="0.0em" class="num">3</text>
