<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-labelledby="t d">
<title id="t">Problems logged per week</title>
<desc id="d">Problems logged per week over 11 weeks: 41, 0, 43, 1, 1, 3, 0, 16, 14, 9, 2.</desc>
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
.num { font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.grow { transform-box: fill-box; transform-origin: 0% 50%; animation: grow .8s cubic-bezier(.22,1,.36,1) both; }
.rise { transform-box: fill-box; transform-origin: 50% 100%; animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
.pop { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .8s cubic-bezier(.22,1,.36,1) both; }
.fade { animation: fade .7s cubic-bezier(.22,1,.36,1) both; }
@media (prefers-reduced-motion: reduce) { .grow, .rise, .pop { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .8s cubic-bezier(.22,1,.36,1) both; }
.fade { animation: none; } }
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#5AC8FA"/></linearGradient>
<linearGradient id="accv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#5AC8FA"/></linearGradient>
